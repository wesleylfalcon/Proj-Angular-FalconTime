<section class="partner-list">
  <div class="partner-list__header">
    <div>
      <h1>Parceiros</h1>
      <p>Cadastro e gerenciamento de parceiros.</p>
    </div>

    <button mat-flat-button type="button" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      Novo parceiro
    </button>
  </div>

  <!--
    O async pipe obtém o valor emitido pelo Observable partners$.
    Quando a API responder, o valor será disponibilizado na variável partners.
  -->
  @if (partners$ | async; as partners) {
    <table mat-table [dataSource]="partners" class="partner-list__table">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let partner">
          {{ partner.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="document">
        <th mat-header-cell *matHeaderCellDef>CNPJ</th>
        <td mat-cell *matCellDef="let partner">
          {{ partner.document }}
        </td>
      </ng-container>

      <ng-container matColumnDef="contactName">
        <th mat-header-cell *matHeaderCellDef>Responsável</th>
        <td mat-cell *matCellDef="let partner">
          {{ partner.contactName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="hourlyRate">
        <th mat-header-cell *matHeaderCellDef>Valor/hora</th>
        <td mat-cell *matCellDef="let partner">
          R$ {{ partner.hourlyRate }}
        </td>
      </ng-container>

      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let partner">
          {{ partner.active ? 'Ativo' : 'Inativo' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>

        <td mat-cell *matCellDef="let partner">
          <button mat-icon-button type="button" aria-label="Editar parceiro" (click)="openEditDialog(partner)">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button type="button" aria-label="Excluir parceiro" (click)="deletePartner(partner)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }
</section>
